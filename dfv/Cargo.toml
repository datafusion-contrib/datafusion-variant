[package]
name = "dfv"
description = "datafusion-cli with the DataFusion Variant functions preinstalled"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "Apache-2.0"
publish = false
default-run = "dfv"

[[bin]]
name = "dfv"
path = "src/main.rs"

[dependencies]
url = "2"
datafusion = { workspace = true }
datafusion-cli = { workspace = true }
datafusion-variant = { path = ".." }
parquet = { workspace = true }

arrow = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true, features = ["cargo"] }
env_logger = { workspace = true }
flate2 = { workspace = true }
futures = { workspace = true }
mimalloc = { workspace = true }
object_store = { version = "0.14", features = ["http"] }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "parking_lot", "rt", "rt-multi-thread", "signal", "sync"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = { workspace = true }
