[package]
name = "datafusion-variant"
description = "Variant functions for DataFusion"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "Apache-2.0"
authors = ["Matthew Kim <matthew@pydantic.dev>"]

[dependencies]
datafusion = { workspace = true }
datafusion-doc = { workspace = true }
datafusion-macros = { workspace = true }
arrow = { workspace = true }
arrow-schema = "60"
parquet-variant-compute = "60.1"
parquet-variant-json = "60.1"
parquet-variant = "60.1"
# Serialize the shared SQL schema AST for aggregate partial states.
sqlparser = { version = "0.63", default-features = false, features = ["serde"] }
serde_json = { version = "1.0.145", features = ["unbounded_depth"] }
serde = { version = "1", features = ["derive"] }
async-trait = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
datafusion-cli = { workspace = true }
parquet = { workspace = true }
tempfile = { workspace = true }
criterion = { version = "0.8", default-features = false }
mimalloc = { workspace = true }
anyhow = "1.0.100"
arrow-cast = "60"
flate2 = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
datafusion-sqllogictest = { workspace = true }
sqllogictest = "0.29"
env_logger = { workspace = true }
insta = "1.43.2"

[[bench]]
name = "variant_get"
harness = false

[[bench]]
name = "to_json"
harness = false

[[bench]]
name = "parse_json"
harness = false

[[bench]]
name = "schema_of_variant"
harness = false

[workspace]
members = ["dfv"]
# Include `dfv` so `cargo run --bin dfv` and `cargo test` work from the root.
default-members = [".", "dfv"]

[workspace.dependencies]
datafusion = { git = "https://github.com/apache/datafusion.git", branch = "branch-56" }
datafusion-cli = { git = "https://github.com/apache/datafusion.git", branch = "branch-56" }
datafusion-benchmarks = { git = "https://github.com/apache/datafusion.git", branch = "branch-56", default-features = false }
datafusion-doc = { git = "https://github.com/apache/datafusion.git", branch = "branch-56" }
datafusion-macros = { git = "https://github.com/apache/datafusion.git", branch = "branch-56" }
datafusion-sqllogictest = { git = "https://github.com/apache/datafusion.git", branch = "branch-56" }
arrow = "60"
parquet = { version = "60", features = ["variant_experimental"] }
async-trait = "0.1"
clap = { version = "4.6", features = ["derive"] }
env_logger = "0.11"
flate2 = "1.0"
futures = "0.3"
mimalloc = "0.1.52"
tempfile = "3"
tokio = "1"
