[package]
name = "datafusion-variant"
description = "Variant functions for DataFusion"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "Apache-2.0"
authors = ["Matthew Kim <matthew@pydantic.dev>"]

[dependencies]
# Pin DataFusion to a revision that uses Arrow 60.
datafusion = { git = "https://github.com/apache/datafusion.git", rev = "484183dc34ea565190d9cd4a66db6d24789f95d0" }
arrow = "60"
arrow-schema = "60"
parquet-variant-compute = "60"
parquet-variant-json = "60"
parquet-variant = "60"
# Serialize the shared SQL schema AST for aggregate partial states.
sqlparser = { version = "0.63", default-features = false, features = ["serde"] }
serde_json = { version = "1.0.145", features = ["unbounded_depth"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
clap = { version = "4.6", features = ["derive"] }
parquet = { version = "60", features = ["variant_experimental"] }
tempfile = "3"
criterion = { version = "0.8", default-features = false }
mimalloc = "0.1.52"
anyhow = "1.0.100"
arrow-cast = "60"
flate2 = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
datafusion-sqllogictest = { git = "https://github.com/apache/datafusion.git", rev = "484183dc34ea565190d9cd4a66db6d24789f95d0" }
sqllogictest = "0.29"
indicatif = "0.18"
env_logger = "0.11"
insta = "1.43.2"
rustyline = { version = "14.0", features = ["derive"] }

[[bench]]
name = "variant_get"
harness = false

[[bench]]
name = "to_json"
harness = false

[[bench]]
name = "parse_json"
harness = false
