name: CI
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  license-header-check:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Install Hawkeye
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: hawkeye@7.2.0

      - name: Check license headers
        run: hawkeye check --fail-on-unknown

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "stable"

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: version info
        run: rustc --version; cargo --version;

      - name: Check generated function reference
        run: |
          cargo run --example generate_function_docs -- --check
          cargo test --example generate_function_docs

      - name: Run all tests
        run: cargo test

  fmt:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt

      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "stable"

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - run: |
          rustup component add clippy
          cargo clippy -- -D warnings
