name: CI
on:
  push:
    branches:
      - main
  pull_request:

# Cancel in-progress runs for the same branch/PR when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  license-header-check:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Install Hawkeye
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: hawkeye@7.2.0

      - name: Check license headers
        run: hawkeye check --fail-on-unknown

  # Uses the stable Rust toolchain preinstalled on the ubuntu-latest runner
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      # Cache cargo's git database and checkouts so git
      # dependencies (e.g. the 1GB+ datafusion-testing submodule) is not
      # re-fetched on every run.
      - name: Cache cargo git dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Install nextest
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest

      - name: version info
        run: rustc --version; cargo --version; cargo nextest --version

      - name: Check generated function reference
        run: |
          cargo run --example generate_function_docs -- --check
          cargo nextest run --example generate_function_docs

      - name: Run all tests
        run: cargo nextest run

  fmt:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt

      - run: cargo fmt --all -- --check

  # Uses the stable Rust toolchain preinstalled on the ubuntu-latest runner
  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      # See comments above
      - name: Cache cargo git dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - run: cargo clippy -- -D warnings
