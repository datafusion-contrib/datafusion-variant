version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      arrow-parquet:
        applies-to: version-updates
        patterns:
          - "arrow*"
          - "parquet"
          - "parquet-variant*"
      datafusion:
        applies-to: version-updates
        patterns:
          - "datafusion*"
